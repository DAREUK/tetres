name: Documentation
on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: zensical build --clean --strict
