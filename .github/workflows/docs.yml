name: Documentation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: zensical build --clean --strict
